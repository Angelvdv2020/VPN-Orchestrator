server {
    listen 80;
    listen [::]:80;
    server_name ru-ingress.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ru-ingress.example.com;

    ssl_certificate /etc/letsencrypt/live/ru-ingress.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ru-ingress.example.com/privkey.pem;

    gzip off;

    location ^~ /edge {
        proxy_pass http://172.18.0.1:9443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        return 404;
    }
}
