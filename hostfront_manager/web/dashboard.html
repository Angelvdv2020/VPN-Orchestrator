<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VPN Orchestrator</title><link rel="icon" href="/favicon.png" type="image/png">
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#e8eef8;background:#09111f}body{max-width:1200px;margin:auto;padding:24px}h1{margin-bottom:4px}.muted{color:#91a3bd}.bar,.card{background:#111d30;border:1px solid #253652;border-radius:12px;padding:16px;margin:14px 0}.bar{display:flex;gap:8px;flex-wrap:wrap}input,button{padding:10px;border-radius:8px;border:1px solid #405372;background:#0c1728;color:#fff}input{flex:1;min-width:240px}button{cursor:pointer;background:#2463eb}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #253652;font-size:14px}.up{color:#55d98a}.down{color:#ff6b79}.unknown{color:#f2c45c}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head>
<body><img src="/assets/vpn-orchestrator-logo.png" alt="VPN Orchestrator" style="max-width:520px;width:100%;height:auto"><h1>VPN Orchestrator</h1><div class="muted">Инфраструктура и мобильная телеметрия</div>
<div class="bar"><input id="token" type="password" placeholder="Admin API token"><button onclick="loadAll()">Обновить</button></div>
<div class="card"><h2>Watchdog</h2><pre id="status">Введите токен</pre></div>
<div class="card"><h2>Проверки</h2><pre id="checks">—</pre></div>
<div class="card"><h2>Remnawave</h2><pre id="inventory">—</pre></div>
<div class="card"><h2>Рекомендованный мобильный путь</h2><pre id="mobile">—</pre></div>
<div class="card"><h2>Телеметрия за 24 часа</h2><table><thead><tr><th>Путь</th><th>Сеть</th><th>Оператор</th><th>Страна</th><th>Статус</th><th>Проб</th><th>Ping</th></tr></thead><tbody id="rows"></tbody></table></div>
<script>
const token=document.querySelector('#token'); token.value=sessionStorage.getItem('hf-token')||'';
async function api(path){sessionStorage.setItem('hf-token',token.value);const r=await fetch(path,{headers:{Authorization:'Bearer '+token.value}});if(!r.ok)throw new Error(r.status+' '+await r.text());return r.json()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function optional(path){try{return await api(path)}catch(e){return {error:e.message}}}
async function loadAll(){try{const [s,c,i,m,t]=await Promise.all([api('/api/v1/status'),api('/api/v1/checks'),optional('/api/v1/inventory'),optional('/api/v1/mobile/recommendation'),api('/api/v1/telemetry/summary?hours=24')]);document.querySelector('#status').textContent=JSON.stringify(s.watchdog,null,2);document.querySelector('#checks').textContent=JSON.stringify(c,null,2);document.querySelector('#inventory').textContent=JSON.stringify(i,null,2);document.querySelector('#mobile').textContent=JSON.stringify(m,null,2);document.querySelector('#rows').innerHTML=t.items.map(x=>`<tr><td>${esc(x.path_id)}</td><td>${esc(x.network)}</td><td>${esc(x.operator)}</td><td>${esc(x.country)}</td><td class="${esc(x.status)}">${esc(x.status)}</td><td>${esc(x.samples)}</td><td>${esc(x.avg_latency_ms)}</td></tr>`).join('')}catch(e){document.querySelector('#status').textContent='Ошибка: '+e.message}}
</script></body></html>
