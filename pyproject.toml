[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hostfront-manager"
version = "4.0.0rc3"
description = "ORCHESTRATOR для автоматизации инфраструктуры Remnawave"
requires-python = ">=3.11"
authors = [{name = "ORCHESTRATOR"}]
dependencies = [
  "cryptography>=42,<47",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
hostfront-manager = "hostfront_manager.cli:entrypoint"
vpn-orchestrator = "hostfront_manager.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["."]
include = ["hostfront_manager*"]

[tool.setuptools.package-data]
hostfront_manager = ["web/*.html", "web/assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
